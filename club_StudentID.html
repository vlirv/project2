<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Requirement 1: viewport meta tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Club Page</title>
  <!-- Requirement 1: Bootstrap 5 via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Requirement 1: full-width header, dark background, white text -->
  <header class="container-fluid bg-dark text-white text-center py-3">
    <h1 class="h3 m-0">HEADER</h1>
  </header>

  <!-- Requirement 2: content inside a centered container -->
  <div class="container my-3">

    <!-- Requirement 2 + 3: main (8) + sidebar (4) from md up;
         below 768px col-12 makes each one full width and stacked -->
    <div class="row">
      <main class="col-12 col-md-8 border p-3">
        <h2 class="h5 text-center">MAIN</h2>

        <!-- Requirement 4: nested row with two equal cards side by side -->
        <div class="row">
          <div class="col-6">
            <div class="border p-2 text-center">Card A</div>
          </div>
          <div class="col-6">
            <div class="border p-2 text-center">Card B</div>
          </div>
        </div>
      </main>

      <aside class="col-12 col-md-4 border p-3 text-center">
        <h2 class="h5">SIDEBAR</h2>
      </aside>
    </div>

    <!-- Requirement 5: 1 per row on phones, 2 from 576px (sm), 4 from 992px (lg) -->
    <div class="row">
      <div class="col-12 col-sm-6 col-lg-3 border p-3 text-center fw-bold">Info 1</div>
      <div class="col-12 col-sm-6 col-lg-3 border p-3 text-center fw-bold">Info 2</div>
      <div class="col-12 col-sm-6 col-lg-3 border p-3 text-center fw-bold">Info 3</div>
      <div class="col-12 col-sm-6 col-lg-3 border p-3 text-center fw-bold">Info 4</div>
    </div>

  </div>

</body>
</html>
